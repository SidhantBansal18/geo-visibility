services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - geo-data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  geo-data:
